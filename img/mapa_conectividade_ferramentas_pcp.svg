<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 480" role="img" aria-labelledby="title desc">
  <title id="title">Mapa de Conectividade das Ferramentas do PCP</title>
  <desc id="desc">Demonstração de como os dados de saída de uma ferramenta tornam-se insumos diretos para a próxima etapa do planejamento.</desc>
  <defs>
    <marker id="arr-teal" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L14,7 L0,14 Z" fill="#1f8a70"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#17324d" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1150" height="480" rx="22" fill="#f7f5ef"/>

  <!-- Faixa de Título Superior -->
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="575" y="38" fill="#142c46" font-size="22" font-weight="700">Fluxo de Informações e Conectividade das Ferramentas</text>
    <text x="575" y="62" fill="#687786" font-size="15">Nenhuma ferramenta do PCP opera isolada: a saída de uma etapa é a premissa obrigatória da seguinte.</text>
  </g>

  <!-- 4 Passos Horizontais Interconectados -->
  <!-- Passo 1: Previsão & Demanda -->
  <g filter="url(#sh)" font-family="Arial, sans-serif">
    <rect x="30" y="90" width="245" height="350" rx="16" fill="#ffffff" stroke="#142c46" stroke-width="3"/>
    <rect x="30" y="90" width="245" height="46" rx="16" fill="#142c46"/>
    <text x="152" y="120" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">1. Previsão e Demanda</text>

    <g font-size="13.5" fill="#17324d">
      <text x="45" y="160" font-weight="700" fill="#176b87">Ferramentas aplicadas:</text>
      <text x="45" y="182">• Séries temporais (MM, SE)</text>
      <text x="45" y="204">• Regressão causal</text>
      <text x="45" y="226">• Controle de erro (MAD, MAPE)</text>

      <line x1="45" y1="242" x2="260" y2="242" stroke="#c5d0d7" stroke-width="1.5"/>

      <text x="45" y="264" font-weight="700" fill="#ba4a5a">Pergunta que responde:</text>
      <text x="45" y="286">Quanto o mercado irá consumir</text>
      <text x="45" y="306">nos próximos períodos?</text>

      <line x1="45" y1="322" x2="260" y2="322" stroke="#c5d0d7" stroke-width="1.5"/>

      <text x="45" y="344" font-weight="700" fill="#1f8a70">Dado repassado adiante:</text>
      <text x="45" y="366" font-weight="600">Demanda independente agregada</text>
      <text x="45" y="386">e carteira firme de pedidos.</text>
    </g>
  </g>

  <!-- Passo 2: PAP e PMP -->
  <g filter="url(#sh)" font-family="Arial, sans-serif">
    <rect x="310" y="90" width="245" height="350" rx="16" fill="#ffffff" stroke="#176b87" stroke-width="3"/>
    <rect x="310" y="90" width="245" height="46" rx="16" fill="#176b87"/>
    <text x="432" y="120" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">2. PAP e PMP (MPS)</text>

    <g font-size="13.5" fill="#17324d">
      <text x="325" y="160" font-weight="700" fill="#176b87">Ferramentas aplicadas:</text>
      <text x="325" y="182">• Planilhas PAP (Chase/Level)</text>
      <text x="325" y="204">• Horizontes e Time Fences</text>
      <text x="325" y="226">• Disponível para Promessa (ATP)</text>

      <line x1="325" y1="242" x2="540" y2="242" stroke="#c5d0d7" stroke-width="1.5"/>

      <text x="325" y="264" font-weight="700" fill="#ba4a5a">Pergunta que responde:</text>
      <text x="325" y="286">O que, quanto e quando produzir</text>
      <text x="325" y="306">de produtos acabados?</text>

      <line x1="325" y1="322" x2="540" y2="322" stroke="#c5d0d7" stroke-width="1.5"/>

      <text x="325" y="344" font-weight="700" fill="#1f8a70">Dado repassado adiante:</text>
      <text x="325" y="366" font-weight="600">Grade congelada/firme</text>
      <text x="325" y="386">de montagem final por período.</text>
    </g>
  </g>

  <!-- Passo 3: MRP e Estoques -->
  <g filter="url(#sh)" font-family="Arial, sans-serif">
    <rect x="590" y="90" width="245" height="350" rx="16" fill="#ffffff" stroke="#1f8a70" stroke-width="3"/>
    <rect x="590" y="90" width="245" height="46" rx="16" fill="#1f8a70"/>
    <text x="712" y="120" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">3. MRP e Estoques</text>

    <g font-size="13.5" fill="#17324d">
      <text x="605" y="160" font-weight="700" fill="#176b87">Ferramentas aplicadas:</text>
      <text x="605" y="182">• Explosão da BOM (Árvore)</text>
      <text x="605" y="204">• Lead times e Lotes (LEC/L4L)</text>
      <text x="605" y="226">• Estoque de Segurança e ROP</text>

      <line x1="605" y1="242" x2="820" y2="242" stroke="#c5d0d7" stroke-width="1.5"/>

      <text x="605" y="264" font-weight="700" fill="#ba4a5a">Pergunta que responde:</text>
      <text x="605" y="286">Quais componentes comprar</text>
      <text x="605" y="306">e fabricar para não faltar peça?</text>

      <line x1="605" y1="322" x2="820" y2="322" stroke="#c5d0d7" stroke-width="1.5"/>

      <text x="605" y="344" font-weight="700" fill="#1f8a70">Dado repassado adiante:</text>
      <text x="605" y="366" font-weight="600">Ordens de compra liberadas</text>
      <text x="605" y="386">e ordens de fabricação fabris.</text>
    </g>
  </g>

  <!-- Passo 4: Programação e Chão de Fábrica -->
  <g filter="url(#sh)" font-family="Arial, sans-serif">
    <rect x="870" y="90" width="250" height="350" rx="16" fill="#ffffff" stroke="#d39b2a" stroke-width="3"/>
    <rect x="870" y="90" width="250" height="46" rx="16" fill="#d39b2a"/>
    <text x="995" y="120" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle">4. Programação &amp; Controle</text>

    <g font-size="13.5" fill="#17324d">
      <text x="885" y="160" font-weight="700" fill="#176b87">Ferramentas aplicadas:</text>
      <text x="885" y="182">• Regras de prioridade (SPT, EDD)</text>
      <text x="885" y="204">• Algoritmo de Johnson (2 maq.)</text>
      <text x="885" y="226">• Gráfico de Gantt de execução</text>

      <line x1="885" y1="242" x2="1100" y2="242" stroke="#c5d0d7" stroke-width="1.5"/>

      <text x="885" y="264" font-weight="700" fill="#ba4a5a">Pergunta que responde:</text>
      <text x="885" y="286">Em qual posto processar agora</text>
      <text x="885" y="306">para minimizar filas e atrasos?</text>

      <line x1="885" y1="322" x2="1100" y2="322" stroke="#c5d0d7" stroke-width="1.5"/>

      <text x="885" y="344" font-weight="700" fill="#1f8a70">Resultado gerado:</text>
      <text x="885" y="366" font-weight="600">Sequência horária de tarefas,</text>
      <text x="885" y="386">redução de WIP e OTIF alto.</text>
    </g>
  </g>

  <!-- Setas de Conexão Entre os Passos -->
  <g fill="none" stroke="#1f8a70" stroke-width="4" marker-end="url(#arr-teal)">
    <path d="M275 265 H304"/>
    <path d="M555 265 H584"/>
    <path d="M835 265 H864"/>
  </g>
</svg>