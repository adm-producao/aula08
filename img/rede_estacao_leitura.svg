<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
  <title id="title">Rede de atividades da estação de inspeção</title>
  <desc id="desc">O início libera A, B e C. A e B liberam D. C e D liberam E. E conduz ao fim.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L14,7 L0,14 Z" fill="#176b87"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#17324d" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1000" height="520" rx="26" fill="#f7f5ef"/>
  <g fill="none" stroke="#176b87" stroke-width="3.5" marker-end="url(#arrow)">
    <path d="M120 260 H165 V90 H216"/>
    <path d="M120 260 H216"/>
    <path d="M120 260 H165 V430 H216"/>
    <path d="M390 90 H445 V170 H496"/>
    <path d="M390 260 H445 V215 H496"/>
    <path d="M390 430 H665 V285 H706"/>
    <path d="M670 190 H690 V240 H706"/>
    <path d="M880 260 H896"/>
  </g>
  <g filter="url(#shadow)" font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="70" cy="260" r="50" fill="#17324d"/>
    <text x="70" y="270" fill="#ffffff" font-size="28" font-weight="700">Início</text>

    <g fill="#ffffff" stroke="#176b87" stroke-width="4.5">
      <rect x="220" y="30" width="170" height="120" rx="22"/>
      <rect x="220" y="200" width="170" height="120" rx="22"/>
      <rect x="220" y="370" width="170" height="120" rx="22"/>
    </g>
    <g fill="#ffffff" stroke="#1f8a70" stroke-width="4.5">
      <rect x="500" y="130" width="170" height="120" rx="22"/>
      <rect x="710" y="200" width="170" height="120" rx="22"/>
    </g>

    <g fill="#17324d" font-size="38" font-weight="700">
      <text x="305" y="82">A</text><text x="305" y="252">B</text><text x="305" y="422">C</text>
      <text x="585" y="182">D</text><text x="795" y="252">E</text>
    </g>
    <g font-size="26">
      <text x="305" y="122" fill="#176b87">2 dias</text>
      <text x="305" y="292" fill="#176b87">4 dias</text>
      <text x="305" y="462" fill="#176b87">3 dias</text>
      <text x="585" y="222" fill="#1f8a70">3 dias</text>
      <text x="795" y="292" fill="#1f8a70">2 dias</text>
    </g>

    <circle cx="950" cy="260" r="50" fill="#17324d"/>
    <text x="950" y="270" fill="#ffffff" font-size="28" font-weight="700">Fim</text>
  </g>
</svg>
