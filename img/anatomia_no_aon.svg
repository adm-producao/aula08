<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 450" role="img" aria-labelledby="title desc">
  <title id="title">Anatomia do nó na rede AON (Activity on Node)</title>
  <desc id="desc">Estrutura padronizada de um nó AON com identificador da atividade, duração, início e término mais cedo (ES e EF), início e término mais tarde (LS e LF) e cálculo da folga total.</desc>
  <defs>
    <marker id="arrow-teal" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L14,7 L0,14 Z" fill="#1f8a70"/>
    </marker>
    <marker id="arrow-rose" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L14,7 L0,14 Z" fill="#ba4a5a"/>
    </marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#17324d" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1120" height="450" rx="22" fill="#f7f5ef"/>

  <!-- Caixa central do Nó AON -->
  <g filter="url(#shadow)">
    <rect x="380" y="45" width="360" height="270" rx="24" fill="#ffffff" stroke="#17324d" stroke-width="6"/>
    <path d="M380 135 H740" stroke="#c5d0d7" stroke-width="3"/>
    <path d="M380 225 H740" stroke="#c5d0d7" stroke-width="3"/>
    <path d="M560 135 V315" stroke="#c5d0d7" stroke-width="3"/>
  </g>

  <!-- Conteúdo do Nó -->
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="560" y="86" fill="#17324d" font-size="32" font-weight="700">Atividade D</text>
    <text x="560" y="120" fill="#176b87" font-size="22" font-weight="700">Duração = 3 dias</text>

    <!-- Quadrante ES -->
    <text x="470" y="175" fill="#1f8a70" font-size="25" font-weight="700">ES = 4</text>
    <text x="470" y="203" fill="#687786" font-size="17">(IMC / DCI)</text>

    <!-- Quadrante EF -->
    <text x="650" y="175" fill="#1f8a70" font-size="25" font-weight="700">EF = 7</text>
    <text x="650" y="203" fill="#687786" font-size="17">(TMC / DCT)</text>

    <!-- Quadrante LS -->
    <text x="470" y="265" fill="#ba4a5a" font-size="25" font-weight="700">LS = 4</text>
    <text x="470" y="293" fill="#687786" font-size="17">(IMT / DTI)</text>

    <!-- Quadrante LF -->
    <text x="650" y="265" fill="#ba4a5a" font-size="25" font-weight="700">LF = 7</text>
    <text x="650" y="293" fill="#687786" font-size="17">(TMT / DTT)</text>
  </g>

  <!-- Anotações à esquerda (Início) -->
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="25" y="135" width="300" height="84" rx="14" fill="#e5f2ee" stroke="#1f8a70" stroke-width="2"/>
    <text x="175" y="164" fill="#17324d" font-size="20" font-weight="700">ES · Early Start</text>
    <text x="175" y="188" fill="#17324d" font-size="17">Início mais cedo possível</text>
    <text x="175" y="209" fill="#1f8a70" font-size="15.5" font-weight="700">Ida: maior EF das predecessoras</text>
    <path d="M325 177 H370" stroke="#1f8a70" stroke-width="3.5" marker-end="url(#arrow-teal)"/>

    <rect x="25" y="233" width="300" height="84" rx="14" fill="#fbecee" stroke="#ba4a5a" stroke-width="2"/>
    <text x="175" y="262" fill="#17324d" font-size="20" font-weight="700">LS · Late Start</text>
    <text x="175" y="286" fill="#17324d" font-size="17">Último início sem atrasar</text>
    <text x="175" y="307" fill="#ba4a5a" font-size="15.5" font-weight="700">Volta: LS = LF − Duração</text>
    <path d="M325 275 H370" stroke="#ba4a5a" stroke-width="3.5" marker-end="url(#arrow-rose)"/>
  </g>

  <!-- Anotações à direita (Término) -->
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="795" y="135" width="300" height="84" rx="14" fill="#e5f2ee" stroke="#1f8a70" stroke-width="2"/>
    <text x="945" y="164" fill="#17324d" font-size="20" font-weight="700">EF · Early Finish</text>
    <text x="945" y="188" fill="#17324d" font-size="17">Término mais cedo possível</text>
    <text x="945" y="209" fill="#1f8a70" font-size="15.5" font-weight="700">Ida: EF = ES + Duração</text>
    <path d="M795 177 H750" stroke="#1f8a70" stroke-width="3.5" marker-end="url(#arrow-teal)"/>

    <rect x="795" y="233" width="300" height="84" rx="14" fill="#fbecee" stroke="#ba4a5a" stroke-width="2"/>
    <text x="945" y="262" fill="#17324d" font-size="20" font-weight="700">LF · Late Finish</text>
    <text x="945" y="286" fill="#17324d" font-size="17">Último término sem atrasar</text>
    <text x="945" y="307" fill="#ba4a5a" font-size="15.5" font-weight="700">Volta: menor LS das sucessoras</text>
    <path d="M795 275 H750" stroke="#ba4a5a" stroke-width="3.5" marker-end="url(#arrow-rose)"/>
  </g>

  <!-- Faixa inferior: Folga Total -->
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="210" y="348" width="700" height="76" rx="18" fill="#17324d"/>
    <text x="560" y="381" fill="#ffffff" font-size="22" font-weight="700">Folga Total (FT) = LS − ES = LF − EF</text>
    <text x="560" y="409" fill="#8ed2c5" font-size="18">Se Folga = 0 → Atividade Crítica (qualquer atraso desloca o fim do projeto)</text>
  </g>
</svg>
