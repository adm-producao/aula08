<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc">
  <title id="title">Passagem para trás e caminho crítico na rede da estação</title>
  <desc id="desc">Cada atividade apresenta duração, datas cedo e datas tarde. B, D e E formam o caminho crítico de nove dias.</desc>
  <defs>
    <marker id="arrow-muted" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#9aa7b2"/>
    </marker>
    <marker id="arrow-critical" markerWidth="16" markerHeight="16" refX="13.5" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L16,8 L0,16 Z" fill="#ba4a5a"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#17324d" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1000" height="570" rx="26" fill="#f7f5ef"/>
  <g fill="none" stroke="#9aa7b2" stroke-width="3" marker-end="url(#arrow-muted)">
    <path d="M120 300 H162 V110 H206"/>
    <path d="M120 300 H162 V490 H206"/>
    <path d="M395 110 H432 V190 H461"/>
    <path d="M395 490 H660 V335 H686"/>
  </g>
  <g fill="none" stroke="#ba4a5a" stroke-width="4.5" marker-end="url(#arrow-critical)">
    <path d="M120 300 H206"/>
    <path d="M395 300 H432 V240 H461"/>
    <path d="M650 258 H686"/>
    <path d="M875 300 H896"/>
  </g>
  <g filter="url(#shadow)" font-family="Arial, sans-serif" text-anchor="middle">
    <circle cx="70" cy="300" r="50" fill="#17324d"/>
    <text x="70" y="294" fill="#ffffff" font-size="27" font-weight="700">Início</text>
    <text x="70" y="320" fill="#ffffff" font-size="20">t = 0</text>

    <g fill="#ffffff" stroke="#9aa7b2" stroke-width="4">
      <rect x="210" y="35" width="185" height="150" rx="22"/>
      <rect x="210" y="415" width="185" height="150" rx="22"/>
    </g>
    <g fill="#fff8f8" stroke="#ba4a5a" stroke-width="5.5">
      <rect x="210" y="225" width="185" height="150" rx="22"/>
      <rect x="465" y="140" width="185" height="150" rx="22"/>
      <rect x="690" y="225" width="185" height="150" rx="22"/>
    </g>

    <g fill="#17324d" font-size="30" font-weight="700">
      <text x="302.5" y="68">A</text><text x="302.5" y="258">B</text><text x="302.5" y="448">C</text>
      <text x="557.5" y="173">D</text><text x="782.5" y="258">E</text>
    </g>
    <g font-size="20">
      <text x="302.5" y="96" fill="#687786">2 dias</text>
      <text x="302.5" y="286" fill="#ba4a5a" font-weight="700">4 dias</text>
      <text x="302.5" y="476" fill="#687786">3 dias</text>
      <text x="557.5" y="201" fill="#ba4a5a" font-weight="700">3 dias</text>
      <text x="782.5" y="286" fill="#ba4a5a" font-weight="700">2 dias</text>
    </g>

    <g stroke="#c5d0d7" stroke-width="2">
      <line x1="210" y1="108" x2="395" y2="108"/><line x1="302.5" y1="108" x2="302.5" y2="185"/><line x1="210" y1="146" x2="395" y2="146"/>
      <line x1="210" y1="298" x2="395" y2="298"/><line x1="302.5" y1="298" x2="302.5" y2="375"/><line x1="210" y1="336" x2="395" y2="336"/>
      <line x1="210" y1="488" x2="395" y2="488"/><line x1="302.5" y1="488" x2="302.5" y2="565"/><line x1="210" y1="526" x2="395" y2="526"/>
      <line x1="465" y1="213" x2="650" y2="213"/><line x1="557.5" y1="213" x2="557.5" y2="290"/><line x1="465" y1="251" x2="650" y2="251"/>
      <line x1="690" y1="298" x2="875" y2="298"/><line x1="782.5" y1="298" x2="782.5" y2="375"/><line x1="690" y1="336" x2="875" y2="336"/>
    </g>
    <g fill="#17324d" font-size="18" font-weight="700">
      <text x="256" y="133">ES 0</text><text x="349" y="133">EF 2</text><text x="256" y="172">LS 2</text><text x="349" y="172">LF 4</text>
      <text x="256" y="323">ES 0</text><text x="349" y="323">EF 4</text><text x="256" y="362">LS 0</text><text x="349" y="362">LF 4</text>
      <text x="256" y="513">ES 0</text><text x="349" y="513">EF 3</text><text x="256" y="552">LS 4</text><text x="349" y="552">LF 7</text>
      <text x="511" y="238">ES 4</text><text x="604" y="238">EF 7</text><text x="511" y="277">LS 4</text><text x="604" y="277">LF 7</text>
      <text x="736" y="323">ES 7</text><text x="829" y="323">EF 9</text><text x="736" y="362">LS 7</text><text x="829" y="362">LF 9</text>
    </g>

    <circle cx="950" cy="300" r="50" fill="#17324d"/>
    <text x="950" y="294" fill="#ffffff" font-size="27" font-weight="700">Fim</text>
    <text x="950" y="320" fill="#ffffff" font-size="20">t = 9</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="20" font-weight="700">
    <rect x="575" y="505" width="370" height="42" rx="21" fill="#ba4a5a"/>
    <text x="760" y="532" text-anchor="middle" fill="#ffffff">Caminho crítico: B–D–E = 9 dias</text>
  </g>
</svg>
