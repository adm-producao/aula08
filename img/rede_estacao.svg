<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Rede AON da preparação de uma estação de inspeção</title>
  <desc id="desc">Início libera A, B e C. A e B precedem D. C e D precedem E. E precede o fim.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L14,7 L0,14 Z" fill="#176b87"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#17324d" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="1200" height="390" rx="26" fill="#f7f5ef"/>
  <g fill="none" stroke="#176b87" stroke-width="3.5" marker-end="url(#arrow)">
    <path d="M155 195 H225 V75 H306"/>
    <path d="M155 195 H306"/>
    <path d="M155 195 H225 V315 H306"/>
    <path d="M470 75 H540 V140 H616"/>
    <path d="M470 195 H540 V175 H616"/>
    <path d="M470 315 H720 V215 H806"/>
    <path d="M780 175 H806"/>
    <path d="M970 195 H1046"/>
  </g>
  <g filter="url(#shadow)" font-family="Arial, sans-serif" text-anchor="middle">
    <g>
      <circle cx="100" cy="195" r="55" fill="#17324d"/>
      <text x="100" y="204" fill="#ffffff" font-size="28" font-weight="700">Início</text>
    </g>
    <g>
      <rect x="310" y="25" width="160" height="100" rx="18" fill="#ffffff" stroke="#176b87" stroke-width="4.5"/>
      <text x="390" y="67" fill="#17324d" font-size="32" font-weight="700">A</text>
      <text x="390" y="101" fill="#176b87" font-size="24">2 dias</text>
    </g>
    <g>
      <rect x="310" y="145" width="160" height="100" rx="18" fill="#ffffff" stroke="#176b87" stroke-width="4.5"/>
      <text x="390" y="187" fill="#17324d" font-size="32" font-weight="700">B</text>
      <text x="390" y="221" fill="#176b87" font-size="24">4 dias</text>
    </g>
    <g>
      <rect x="310" y="265" width="160" height="100" rx="18" fill="#ffffff" stroke="#176b87" stroke-width="4.5"/>
      <text x="390" y="307" fill="#17324d" font-size="32" font-weight="700">C</text>
      <text x="390" y="341" fill="#176b87" font-size="24">3 dias</text>
    </g>
    <g>
      <rect x="620" y="105" width="160" height="100" rx="18" fill="#ffffff" stroke="#1f8a70" stroke-width="4.5"/>
      <text x="700" y="147" fill="#17324d" font-size="32" font-weight="700">D</text>
      <text x="700" y="181" fill="#1f8a70" font-size="24">3 dias</text>
    </g>
    <g>
      <rect x="810" y="145" width="160" height="100" rx="18" fill="#ffffff" stroke="#1f8a70" stroke-width="4.5"/>
      <text x="890" y="187" fill="#17324d" font-size="32" font-weight="700">E</text>
      <text x="890" y="221" fill="#1f8a70" font-size="24">2 dias</text>
    </g>
    <g>
      <circle cx="1105" cy="195" r="55" fill="#17324d"/>
      <text x="1105" y="204" fill="#ffffff" font-size="28" font-weight="700">Fim</text>
    </g>
  </g>
</svg>
