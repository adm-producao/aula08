<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 455" role="img" aria-labelledby="title desc">
  <title id="title">Regras de convergência na ida e divergência na volta</title>
  <desc id="desc">Comparação visual entre a escolha do maior EF nas convergências durante a passagem para frente e a escolha do menor LS nas divergências durante a passagem para trás.</desc>
  <defs>
    <marker id="arr-teal" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L14,7 L0,14 Z" fill="#1f8a70"/>
    </marker>
    <marker id="arr-muted" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L13,6.5 L0,13 Z" fill="#9aa7b2"/>
    </marker>
    <marker id="arr-rose" markerWidth="16" markerHeight="16" refX="13.5" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L16,8 L0,16 Z" fill="#ba4a5a"/>
    </marker>
  </defs>

  <rect width="1150" height="455" rx="22" fill="#f7f5ef"/>

  <!-- Painel Esquerdo: Ida (Convergência -> Máximo) -->
  <rect x="25" y="20" width="535" height="415" rx="18" fill="#ffffff" stroke="#1f8a70" stroke-width="4"/>
  <rect x="25" y="20" width="535" height="56" rx="18" fill="#1f8a70"/>
  <text x="292" y="56" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">1. Passagem para frente (Ida) · Convergência</text>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <!-- Nó A -->
    <rect x="55" y="105" width="175" height="90" rx="16" fill="#f7f5ef" stroke="#9aa7b2" stroke-width="3"/>
    <text x="142" y="139" fill="#17324d" font-size="22" font-weight="700">A (2 dias)</text>
    <text x="142" y="174" fill="#687786" font-size="19" font-weight="700">ES = 0 | EF = 2</text>

    <!-- Nó B -->
    <rect x="55" y="235" width="175" height="90" rx="16" fill="#e5f2ee" stroke="#1f8a70" stroke-width="4"/>
    <text x="142" y="269" fill="#17324d" font-size="22" font-weight="700">B (4 dias)</text>
    <text x="142" y="304" fill="#1f8a70" font-size="19" font-weight="700">ES = 0 | EF = 4</text>

    <!-- Setas para D -->
    <path d="M230 150 H282 V198 H340" fill="none" stroke="#9aa7b2" stroke-width="3.5" marker-end="url(#arr-muted)"/>
    <path d="M230 280 H282 V232 H340" fill="none" stroke="#1f8a70" stroke-width="4.5" marker-end="url(#arr-teal)"/>

    <!-- Nó D -->
    <rect x="345" y="165" width="190" height="102" rx="16" fill="#ffffff" stroke="#17324d" stroke-width="4"/>
    <text x="440" y="198" fill="#17324d" font-size="23" font-weight="700">D (3 dias)</text>
    <text x="440" y="229" fill="#1f8a70" font-size="20" font-weight="700">ES = máx(2, 4) = 4</text>
    <text x="440" y="254" fill="#17324d" font-size="18" font-weight="700">EF = 4 + 3 = 7</text>

    <!-- Explicação -->
    <rect x="45" y="350" width="495" height="66" rx="12" fill="#e5f2ee"/>
    <text x="292" y="376" fill="#17324d" font-size="18" font-weight="700">Regra da convergência: escolha o MAIOR EF</text>
    <text x="292" y="401" fill="#17324d" font-size="15.5">D depende de A e B prontas → espera a mais lenta (B = 4).</text>
  </g>

  <!-- Painel Direito: Volta (Divergência -> Mínimo) -->
  <rect x="590" y="20" width="535" height="415" rx="18" fill="#ffffff" stroke="#ba4a5a" stroke-width="4"/>
  <rect x="590" y="20" width="535" height="56" rx="18" fill="#ba4a5a"/>
  <text x="857" y="56" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">2. Passagem para trás (Volta) · Divergência</text>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <!-- Nó B -->
    <rect x="615" y="165" width="190" height="102" rx="16" fill="#ffffff" stroke="#17324d" stroke-width="4"/>
    <text x="710" y="198" fill="#17324d" font-size="23" font-weight="700">B (4 dias)</text>
    <text x="710" y="229" fill="#ba4a5a" font-size="20" font-weight="700">LF = mín(6, 13) = 6</text>
    <text x="710" y="254" fill="#17324d" font-size="18" font-weight="700">LS = 6 − 4 = 2</text>

    <!-- Setas saindo de B para E e G -->
    <path d="M805 198 H858 V150 H915" fill="none" stroke="#ba4a5a" stroke-width="4.5" marker-end="url(#arr-rose)"/>
    <path d="M805 232 H858 V280 H915" fill="none" stroke="#9aa7b2" stroke-width="3.5" marker-end="url(#arr-muted)"/>

    <!-- Nó E -->
    <rect x="920" y="105" width="180" height="90" rx="16" fill="#fbecee" stroke="#ba4a5a" stroke-width="4"/>
    <text x="1010" y="139" fill="#17324d" font-size="22" font-weight="700">E (6 dias)</text>
    <text x="1010" y="174" fill="#ba4a5a" font-size="19" font-weight="700">LS = 6 | LF = 12</text>

    <!-- Nó G -->
    <rect x="920" y="235" width="180" height="90" rx="16" fill="#f7f5ef" stroke="#9aa7b2" stroke-width="3"/>
    <text x="1010" y="269" fill="#17324d" font-size="22" font-weight="700">G (2 dias)</text>
    <text x="1010" y="304" fill="#687786" font-size="19" font-weight="700">LS = 13 | LF = 15</text>

    <!-- Explicação -->
    <rect x="610" y="350" width="495" height="66" rx="12" fill="#fbecee"/>
    <text x="857" y="376" fill="#17324d" font-size="18" font-weight="700">Regra da divergência: escolha o MENOR LS</text>
    <text x="857" y="401" fill="#17324d" font-size="15.5">B não pode atrasar sucessoras → vale a mais urgente (E = 6).</text>
  </g>
</svg>
