<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
  <title id="title">Passagem para frente na rede da estação</title>
  <desc id="desc">Cada atividade apresenta duração, início mais cedo e término mais cedo. O projeto termina no dia nove.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L14,7 L0,14 Z" fill="#176b87"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#17324d" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1000" height="540" rx="26" fill="#f7f5ef"/>
  <g fill="none" stroke="#176b87" stroke-width="3.5" marker-end="url(#arrow)">
    <path d="M120 280 H162 V105 H206"/>
    <path d="M120 280 H206"/>
    <path d="M120 280 H162 V455 H206"/>
    <path d="M395 105 H432 V185 H461"/>
    <path d="M395 280 H432 V230 H461"/>
    <path d="M395 455 H660 V310 H686"/>
    <path d="M650 240 H686"/>
    <path d="M875 280 H896"/>
