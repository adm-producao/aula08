      <line x1="210" y1="295" x2="395" y2="295"/><line x1="302.5" y1="295" x2="302.5" y2="345"/>
      <line x1="210" y1="470" x2="395" y2="470"/><line x1="302.5" y1="470" x2="302.5" y2="520"/>
      <line x1="465" y1="220" x2="650" y2="220"/><line x1="557.5" y1="220" x2="557.5" y2="270"/>
