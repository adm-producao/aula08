<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 430" role="img" aria-labelledby="title desc">
  <title id="title">Análise de sensibilidade: Efeito da revisão de F para 4 dias</title>
  <desc id="desc">Comparação lado a lado: como F possuía folga de apenas 1 dia, seu aumento de 2 dias desloca o caminho A-D-F-G-I para 23 dias, tornando-o o novo caminho crítico e atrasando o projeto em 1 dia.</desc>

  <rect width="1150" height="430" rx="22" fill="#f7f5ef"/>

  <!-- Painel Esquerdo: Cenário Original (F = 2 dias) -->
  <rect x="30" y="20" width="525" height="390" rx="18" fill="#ffffff" stroke="#176b87" stroke-width="3.5"/>
  <rect x="30" y="20" width="525" height="52" rx="18" fill="#176b87"/>
  <text x="292" y="53" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Cenário Original · F = 2 dias (Folga = 1 dia)</text>

  <g font-family="Arial, sans-serif" font-size="16" fill="#17324d">
    <!-- Tabela dos 4 caminhos -->
    <rect x="50" y="90" width="485" height="195" rx="12" fill="#f4f6f3" stroke="#c5d0d7" stroke-width="1.5"/>
    <text x="70" y="120" font-weight="700" fill="#ba4a5a">• Caminho 1 (A–B–E–G–I): 1+4+6+7+4 = 22 dias (CRÍTICO)</text>
    <text x="70" y="155" font-weight="600">• Caminho 2 (A–C–F–G–I): 1+3+2+7+4 = 17 dias (Folga = 5d)</text>
    <text x="70" y="190" font-weight="700" fill="#176b87">• Caminho 3 (A–D–F–G–I): 1+7+2+7+4 = 21 dias (Quase crítico!)</text>
    <text x="70" y="225" font-weight="600">• Caminho 4 (A–D–H–I): 1+7+9+4 = 21 dias (Folga = 1d)</text>

    <!-- Caixa resumo -->
    <rect x="50" y="300" width="485" height="90" rx="12" fill="#e5f2ee" stroke="#1f8a70" stroke-width="2"/>
    <text x="292" y="330" font-size="17" font-weight="700" fill="#1f8a70" text-anchor="middle">Prazo final = 22 dias</text>
    <text x="292" y="355" font-size="15" text-anchor="middle">F tem folga total = 1 dia (ES = 8, LF = 11, Dur = 2)</text>
    <text x="292" y="376" font-size="14" fill="#687786" text-anchor="middle">Qualquer acréscimo em F acima de 1 dia estourará o prazo!</text>
  </g>

  <!-- Painel Direito: Cenário Revisado (F = 4 dias) -->
  <rect x="595" y="20" width="525" height="390" rx="18" fill="#ffffff" stroke="#ba4a5a" stroke-width="3.5"/>
  <rect x="595" y="20" width="525" height="52" rx="18" fill="#ba4a5a"/>
  <text x="857" y="53" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Cenário Revisado · F = 4 dias (+2 dias)</text>

  <g font-family="Arial, sans-serif" font-size="16" fill="#17324d">
    <!-- Tabela dos 4 caminhos recalculados -->
    <rect x="615" y="90" width="485" height="195" rx="12" fill="#fff8f8" stroke="#ba4a5a" stroke-width="1.5"/>
    <text x="635" y="120" font-weight="600">• Caminho 1 (A–B–E–G–I): 1+4+6+7+4 = 22 dias</text>
    <text x="635" y="155" font-weight="600">• Caminho 2 (A–C–F–G–I): 1+3+4+7+4 = 19 dias</text>
    <text x="635" y="190" font-weight="700" fill="#ba4a5a">• Caminho 3 (A–D–F–G–I): 1+7+4+7+4 = 23 dias (NOVO CRÍTICO!)</text>
    <text x="635" y="225" font-weight="600">• Caminho 4 (A–D–H–I): 1+7+9+4 = 21 dias</text>

    <!-- Caixa conclusão -->
    <rect x="615" y="300" width="485" height="90" rx="12" fill="#fbecee" stroke="#ba4a5a" stroke-width="2"/>
    <text x="857" y="330" font-size="18" font-weight="700" fill="#ba4a5a" text-anchor="middle">Prazo final salta para 23 dias (+1 dia de atraso!)</text>
    <text x="857" y="355" font-size="15" text-anchor="middle">O caminho crítico MUDOU de A-B-E-G-I para A-D-F-G-I.</text>
    <text x="857" y="376" font-size="14" fill="#ba4a5a" font-weight="700" text-anchor="middle">Consumiu 1d de folga e gerou 1d de atraso no projeto.</text>
  </g>
</svg>