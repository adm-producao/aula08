<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 380" width="100%" height="auto" style="background: white; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Arrow marker critical -->
    <marker id="arrow-crit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#b91c1c" />
    </marker>
    <!-- Arrow marker non-critical -->
    <marker id="arrow-norm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <!-- Filter for soft drop shadow -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Title / Legend bar -->
  <rect x="20" y="12" width="980" height="36" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="35" y="35" font-size="13" font-weight="bold" fill="#1e293b">DIAGRAMA DE REDE AON (NÓ-NA-ATIVIDADE) COM CRONOGRAMA INTEGRADO</text>
  
  <rect x="590" y="22" width="16" height="16" rx="3" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="612" y="35" font-size="11" font-weight="600" fill="#b91c1c">Caminho Crítico (FT = 0)</text>

  <rect x="770" y="22" width="16" height="16" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="792" y="35" font-size="11" font-weight="600" fill="#475569">Atividade com Folga (FT &gt; 0)</text>

  <!-- Arrows (Connectors) -->
  <!-- A to B (Crit) -->
  <path d="M 140 170 L 190 170 L 190 115 L 230 115" fill="none" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrow-crit)" />
  
  <!-- A to C (Norm) -->
  <path d="M 140 200 L 190 200 L 190 275 L 230 275" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrow-norm)" />
  
  <!-- B to D (Crit) -->
  <path d="M 350 115 L 420 115" fill="none" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrow-crit)" />
  
  <!-- C to E (Norm) -->
  <path d="M 350 275 L 420 275" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrow-norm)" />
  
  <!-- D to F (Crit) -->
  <path d="M 540 100 L 590 100 L 590 85 L 630 85" fill="none" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrow-crit)" />
  
  <!-- D to G (Crit) -->
  <path d="M 540 125 L 580 125 L 580 195 L 630 195" fill="none" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrow-crit)" />
  
  <!-- E to G (Norm) -->
  <path d="M 540 275 L 590 275 L 590 215 L 630 215" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arrow-norm)" />
  
  <!-- F to H (Crit) -->
  <path d="M 750 85 L 800 85 L 800 160 L 830 160" fill="none" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrow-crit)" />
  
  <!-- G to H (Crit) -->
  <path d="M 750 205 L 800 205 L 800 180 L 830 180" fill="none" stroke="#b91c1c" stroke-width="2.5" marker-end="url(#arrow-crit)" />


