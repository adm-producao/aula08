    <text x="60" y="58" font-size="10" font-weight="bold" fill="#b91c1c" text-anchor="middle">FT=0</text>
    <text x="100" y="58" font-size="11" font-weight="bold" fill="#1e293b" text-anchor="middle">2</text>
  </g>

