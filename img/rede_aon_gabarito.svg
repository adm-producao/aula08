    <text x="190" y="22" font-size="11" fill="#334155">Superior: <tspan font-weight="bold">ES (IMC)</tspan> · Início Cedo  |  <tspan font-weight="bold">d</tspan> · Duração  |  <tspan font-weight="bold">EF (TMC)</tspan> · Término Cedo</text>
